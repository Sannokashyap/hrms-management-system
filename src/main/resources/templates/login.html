<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base :: layout(~{::main})}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>HR Synergy Login</title>
</head>
<body>
	<main>
<div class="container-fluid bg-primary bg-opacity-10 py-5 min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card border-0 shadow-lg rounded-4 overflow-hidden col-lg-8">

        <div class="row g-0">

            <!-- Left Side -->
            <div class="col-lg-6  text-white p-5 d-flex flex-column justify-content-center"
            style="background: linear-gradient(135deg, #2563EB 0%, #4F46E5 45%, #7C3AED 75%, #6D28D9 100%);">



                <div class="bg-white bg-opacity-25 rounded-4 d-inline-flex align-items-center justify-content-center mb-4"
                     style="width:70px;height:70px;">
                    <i class="bi bi-shield-lock fs-2"></i>
                </div>

                <h3 class="fw-bold mb-2">Welcome Back</h3>

                <p class="fs-5">
                    Sign in to manage your workspace, track your team and stay on top of everything that matters.
                </p>

                <div class="mt-4">
                    <p><i class="bi bi-check-circle-fill me-2"></i>Secure role-based access</p>
                    <p><i class="bi bi-check-circle-fill me-2"></i>Built for admins & employees</p>
                    <p><i class="bi bi-check-circle-fill me-2"></i>Fast, reliable, always available</p>
                </div>

            </div>

            <!-- Right Side -->
            <div class="col-lg-6 bg-white p-5">

                <h2 class="fw-bold" style="color:black;">Login</h2>

                <p class="text-secondary mb-4">
                    Enter your credentials to continue
                </p>

                <!-- Error Message -->
                <div th:if="${msg}" class="alert alert-danger" th:text="${msg}"></div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input type="email"
                                   name="emailaddress"
                                   class="form-control"
                                   placeholder="Enter Email"
                                   required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input type="password"
                                   name="pwd"
                                   class="form-control"
                                   placeholder="Enter Password"
                                   required>

                        </div>

                    </div>

                    <div class="text-end mb-3">
                        <a th:href="@{/forgot-password}"
                           class="text-decoration-none text-secondary fw-semibold">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit"
                            class="btn w-100 text-white py-2 fw-bold"
                                 style="background: linear-gradient(135deg, #2563EB 0%, #4F46E5 45%, #7C3AED 75%, #6D28D9 100%);">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
		
	</main>
</body>

</html>
