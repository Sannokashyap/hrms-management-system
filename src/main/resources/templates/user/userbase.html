<!DOCTYPE html>
<html lang="en" th:fragment="layout(usercontent)">
<!-- [Head] start -->

<head>
  <title>Job Seeker Dashboard</title>
  <!-- [Meta] -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">


  <!-- [Favicon] icon -->
  <link rel="icon" href="" type="image/x-icon">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- data tables css -->
  <link rel="stylesheet" href='/user/assets/css/plugins/dataTables.bootstrap5.min.css' >
  <!-- [Google Font] Family -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    id="main-font-link">
  <!-- [Tabler Icons] https://tablericons.com -->
  <link rel="stylesheet" href='/user/assets/fonts/tabler-icons.min.css' >
  <!-- [Feather Icons] https://feathericons.com -->
  <link rel="stylesheet" href='/user/assets/fonts/feather.css' >
  <!-- [Font Awesome Icons] https://fontawesome.com/icons -->
  <link rel="stylesheet" href='/user/assets/fonts/fontawesome.css' >
  <!-- [Material Icons] https://fonts.google.com/icons -->
  <link rel="stylesheet" href='/user/assets/fonts/material.css' >
  <!-- [Template CSS Files] -->
  <link rel="stylesheet" href='/user/assets/css/style.css'  id="main-style-link">
  <link rel="stylesheet" href='/user/assets/css/style-preset.css' >
 <style>


/* Sidebar Menu Text */
.pc-sidebar .pc-link{
    color:#ffffff !important;
}

/* Menu Text */
.pc-sidebar .pc-mtext{
    color:#ffffff !important;
}

/* Icons */
.pc-sidebar .pc-micon i,
.pc-sidebar .pc-link i{
    color:#ffffff !important;
}

/* Section Heading (Dashboard, Manage, etc.) */
.pc-sidebar .pc-caption label{
    color:#ffffff !important;
}

/* Logo */
.pc-sidebar .b-brand{
    color:#ffffff !important;
}

/* Hover */
.pc-sidebar .pc-link:hover{
    background:#204352 !important;
    color:#ffffff !important;
}

/* Active Menu */
.pc-sidebar .pc-item.active > .pc-link{
    background:#2563eb !important;
    color:#ffffff !important;
}
</style>

</head>
<!-- [Head] end -->
<!-- [Body] Start -->

<body data-pc-preset="preset-1" data-pc-direction="ltr" data-pc-theme="light">
  <!-- [ Pre-loader ] start -->
  <div class="loader-bg">
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>
  </div>
  <!-- [ Pre-loader ] End -->
  <!-- [ Sidebar Menu ] start -->
  <nav class="pc-sidebar"  style="background: linear-gradient(135deg, #2563EB 0%, #4F46E5 45%, #7C3AED 75%, #6D28D9 100%);">
    <div class="navbar-wrapper">
      <div class="m-header">

<div class="d-inline-flex align-items-center justify-content-center ms-2 mt-2"
     style="
        width:60px;
        height:60px;
        border-radius:20px;
        background:rgba(255,255,255,0.18);
        border:1px solid rgba(255,255,255,0.25);
        backdrop-filter:blur(8px);
     ">
                    <i class="bi bi-shield-lock fs-2"></i>
                </div>
    <a href="user/userdash" class="b-brand ms-2 text-white text-decoration-none">

        <h4 class="mb-0 text-white fw-bold">
            HR Synergy
        </h4>

        <small style="color:#cbd5e1;">
            Candidate Portal
        </small>

    </a>

</div>

<hr>

<!-- Candidate Profile -->

<div class="text-center py-4 border-bottom">

    <!-- Profile Icon -->
    <div class="mx-auto d-flex align-items-center justify-content-center rounded-circle mb-3"
         style="width:80px;height:80px;background:rgba(255,255,255,.15);">

        <i class="ti ti-user text-white" style="font-size:40px;"></i>

    </div>

    <!-- Name -->
    <h6 class="text-white fw-bold mb-1">
        Welcome Candidate
    </h6>

    <!-- Status -->
    <span class="badge rounded-pill px-3 py-2"
          style="background:#22c55e;">

        <i class="ti ti-circle-filled me-1"
           style="font-size:8px;"></i>

        Active Candidate

    </span>

</div>
<hr>

      <div class="navbar-content">
        <ul class="pc-navbar">
          <li class="pc-item">
            <a href="/user/userdash" class="pc-link">
              <span class="pc-micon"><i class="ti ti-dashboard"></i></span>
              <span class="pc-mtext">Dashboard</span>
            </a>
          </li>

          <li class="pc-item pc-caption">
            <label>Manage</label>
            <i class="ti ti-dashboard"></i>
          </li>
        
          <li class="pc-item">
            <a href="/user/viewjob" class="pc-link">
              <span class="pc-micon"><i class="ti ti-typography"></i></span>
              <span class="pc-mtext">View Jobs</span>
            </a>
          </li>
          <li class="pc-item">
            <a href="/user/giveresponse" class="pc-link">
              <span class="pc-micon"><i class="ti ti-typography"></i></span>
              <span class="pc-mtext">Give Response</span>
            </a>
          </li>
          <li class="pc-item">
            <a href="/user/viewprofile" class="pc-link">
              <span class="pc-micon"><i class="ti ti-typography"></i></span>
              <span class="pc-mtext">View Profile</span>
            </a>
          </li>
          
          <li class="pc-item pc-caption">
            <label>Actions</label>
            <i class="ti ti-news"></i>
          </li>
          <li class="pc-item">
            <a href="/user/changepwd" class="pc-link">
              <span class="pc-micon"><i class="ti ti-lock"></i></span>
              <span class="pc-mtext">Change Password</span>
            </a>
          </li>
          <li class="pc-item">
            <a href="/user/logout" class="pc-link">
              <span class="pc-micon"> <i class="ti ti-power"></i></span>
              <span class="pc-mtext">Logout</span>
            </a>
          </li>

        </ul>

      </div>
    </div>
  </nav>
  <!-- [ Sidebar Menu ] end --> <!-- [ Header Topbar ] start -->
  <header class="pc-header">
    <div class="header-wrapper"> <!-- [Mobile Media Block] start -->
      <div class="me-auto pc-mob-drp">
        <ul class="list-unstyled">
          <!-- ======= Menu collapse Icon ===== -->
          <li class="pc-h-item pc-sidebar-collapse">
            <a href="#" class="pc-head-link ms-0" id="sidebar-hide">
              <i class="ti ti-menu-2"></i>
            </a>
          </li>
          <li class="pc-h-item pc-sidebar-popup">
            <a href="#" class="pc-head-link ms-0" id="mobile-collapse">
              <i class="ti ti-menu-2"></i>
            </a>
          </li>
          <li class="dropdown pc-h-item d-inline-flex d-md-none">
            <a class="pc-head-link dropdown-toggle arrow-none m-0" data-bs-toggle="dropdown" href="#" role="button"
              aria-haspopup="false" aria-expanded="false">
              <i class="ti ti-search"></i>
            </a>
            <div class="dropdown-menu pc-h-dropdown drp-search">
              <form class="px-3">
                <div class="form-group mb-0 d-flex align-items-center">
                  <i data-feather="search"></i>
                  <input type="search" class="form-control border-0 shadow-none" placeholder="Search here. . .">
                </div>
              </form>
            </div>
          </li>
          <li class="pc-h-item d-none d-md-inline-flex">
            <form class="header-search">
              <i data-feather="search" class="icon-search"></i>
              <input type="search" class="form-control" placeholder="Search here. . .">
            </form>
          </li>
        </ul>
      </div>
      <!-- [Mobile Media Block end] -->
      <div class="ms-auto">
        <ul class="list-unstyled">
          
          <li class="dropdown pc-h-item header-user-profile">
            <a class="pc-head-link dropdown-toggle arrow-none me-0" data-bs-toggle="dropdown" href="#" role="button"
              aria-haspopup="false" data-bs-auto-close="outside" aria-expanded="false">
              <img src='/user/assets/images/user/avatar-2.jpg'  alt="user-image" class="user-avtar">
              <span>Job Seeker</span>
            </a>
            <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown">
              <div class="dropdown-header">
                <div class="d-flex mb-1">
                  <div class="flex-shrink-0">
                    <img src='/user/assets/images/user/avatar-2.jpg'  alt="user-image"
                      class="user-avtar wid-35">
                  </div>
                  <div class="flex-grow-1 ms-3">
                    <h6 class="mb-1">Job Seeker</h6>
                    <span>Name</span>
                  </div>
                  <!-- LOGOUT -->
                  <a href="#" class="pc-head-link bg-transparent"><i class="ti ti-power text-danger"></i></a>
                </div>
              </div>
              
              <div class="tab-content" id="mysrpTabContent">
                <div class="tab-pane fade show active" id="drp-tab-1" role="tabpanel" aria-labelledby="drp-t1"
                  tabindex="0">
                  <a href="#" class="dropdown-item">
                    <i class="ti ti-lock"></i>
                    <span>Change Password</span>
                  </a>
                  
                  <a href="/user/logout" class="dropdown-item">
                    <i class="ti ti-power"></i>
                    <span>Logout</span>
                  </a>
                </div>
                
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </header>
  <!-- [ Header ] end -->



  <!-- [ Main Content ] start -->
  <div class="pc-container">
    <div class="pc-content">
      <div th:replace="${usercontent}"></div>
    </div>
  </div>
  <!-- [ Main Content ] end -->
  <footer class="pc-footer">
    <div class="footer-wrapper container-fluid">
      <div class="row">
        
        <div class="col-auto my-1">
          <ul class="list-inline footer-link mb-0">
            <li class="list-inline-item"><a href="../index.html">Home</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <!-- [Page Specific JS] start -->
  <script src='/user/assets/js/plugins/apexcharts.min.js' ></script>
  <script src='/user/assets/js/pages/dashboard-default.js' ></script>
  <!-- [Page Specific JS] end -->
  <!-- Required Js -->
  <script src='/user/assets/js/plugins/popper.min.js' ></script>
  <script src='/user/assets/js/plugins/simplebar.min.js' ></script>
  <script src='/user/assets/js/plugins/bootstrap.min.js' ></script>
  <script src='/user/assets/js/fonts/custom-font.js' ></script>
  <script src='/user/assets/js/pcoded.js' ></script>
  <script src='/user/assets/js/plugins/feather.min.js' ></script>




<script>
window.addEventListener("pageshow",function(event){
	if(event.persisted || performance.getEntriesByType("navigation") [0]?.type==="back_forward"){
		window.location.reload();
	}
});

  <script>layout_change('light');</script>




  <script>change_box_container('false');</script>



  <script>layout_rtl_change('false');</script>


  <script>preset_change("preset-1");</script>


  <script>font_change("Public-Sans");</script>

  <script src='/user/assets/js/plugins/sweetalert2.all.min.js' ></script>
  
</body>
<!-- [Body] end -->

</html>
