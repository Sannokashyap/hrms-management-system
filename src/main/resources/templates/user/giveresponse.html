<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<body>
 <main>
 <h2 style="color:black;text-align:center;">Submit Your Feedback / Complaint</h2>
 <hr>
 <div th:if="${msg}">
 
 <p th:text="${msg}" style="color:green;text-align:center;"></p>
 </div>
 
 <form  method="post" th:object="${rdto}">
 <div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-lg">

                <div class="card-header text-white text-center py-4 border-0"
                    style="background:linear-gradient(135deg,#2563eb,#7c3aed);">

                    <h3 class="fw-bold text-white mb-1">
                        <i class="bi bi-chat-left-text-fill me-2"></i>
                        Submit Feedback / Complaint
                    </h3>

                    <p class="mb-0">
                        Share your feedback, suggestions or complaints with HR
                    </p>

                </div>

                <div class="card-body p-4">

                    <form method="post" th:object="${rdto}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Response Type
                            </label>

                            <select class="form-select"
                                th:field="*{responsetype}">
                                <option value="">Select Response Type</option>
                                <option value="feedback">Feedback</option>
                                <option value="complaint">Complaint</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Subject
                            </label>

                            <input type="text"
                                th:field="*{subject}"
                                class="form-control"
                                placeholder="Enter subject"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Message
                            </label>

                            <textarea rows="5"
                                th:field="*{responsetext}"
                                class="form-control"
                                placeholder="Write your feedback or complaint here..."
                                required></textarea>
                        </div>

                        <div class="text-center">

                            <button type="submit"
                                class="btn btn-lg text-white px-5 rounded-pill"
                                style="background:linear-gradient(135deg,#2563eb,#7c3aed);">

                                <i class="bi bi-send-fill me-2"></i>
                                Submit Response

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
 </form>
 
 </main>
 </body>
 </html>
