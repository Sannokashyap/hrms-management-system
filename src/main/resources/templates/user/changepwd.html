<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<body>
 <main>
 	<h2 style="color:green;text-align:center;">Change User Password</h2>
 	<div th:if="${msg}">
 	<p style="color:red;text-align:center;" th:text="${msg}"></p>
 	</div>
 	<hr/>
 	<form method="post" action="user/userdash">

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0"
                 style="border-radius:20px; overflow:hidden;">

                <!-- Header -->

                <div class="card-header text-white py-3"
                     style="background:linear-gradient(135deg,#2563eb,#4f46e5);">

                    <h3 class="mb-1 text-white fw-bold">
                        <i class="ti ti-lock-password me-2"></i>
                        Change Password
                    </h3>

                    <small>
                        Update your account password securely
                    </small>

                </div>

                <!-- Body -->

                <div class="card-body p-4">

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="ti ti-lock me-2 text-primary"></i>
                            Old Password
                        </label>

                        <input type="password"
                               name="oldpassword"
                               class="form-control"
                               placeholder="Enter Old Password"
                               style="height:48px;border-radius:12px;"
                               required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="ti ti-key me-2 text-success"></i>
                            New Password
                        </label>

                        <input type="password"
                               name="newpassword"
                               class="form-control"
                               placeholder="Enter New Password"
                               style="height:48px;border-radius:12px;"
                               required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="ti ti-check me-2 text-warning"></i>
                            Confirm Password
                        </label>

                        <input type="password"
                               name="confirmpassword"
                               class="form-control"
                               placeholder="Confirm New Password"
                               style="height:48px;border-radius:12px;"
                               required>

                    </div>

                    <hr>

                    <div class="text-end">

                        <button type="reset"
                                class="btn btn-outline-secondary px-4 me-2">

                            <i class="ti ti-refresh me-1"></i>

                            Reset

                        </button>

                        <button type="submit"
                                class="btn btn-primary px-4">

                            <i class="ti ti-device-floppy me-1"></i>

                            Change Password

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</form>
 </main>
</body>
</html>
