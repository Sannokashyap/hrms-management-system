<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
	<main>
		<h1>View All Feedback</h1>
		<hr>
		
		<div  th:if="${msg}">
		<p th:text="${msg}" style="color:red;text-align:center;"></p>
		</div>
		<div class="container py-5">

    <div class="card border-0 shadow-lg">

        <div class="card-header text-white py-4 border-0"
              style="background: linear-gradient(135deg, #2563EB 0%, #4F46E5 45%, #7C3AED 75%, #6D28D9 100%);">

            <h3 class="fw-bold text-white mb-1">
                <i class="bi bi-chat-left-dots-fill me-2"></i>
                Employee Feedback List
            </h3>

            <p class="mb-0">
                View all submitted feedback and suggestions
            </p>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Contact No</th>
                            <th>Subject</th>
                            <th>Feedback</th>
                            <th>Posted Date</th>
                            <th>Delete</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="f:${feed}">

                            <td th:text="${f.id}"></td>

                            <td>
                                <span class="fw-semibold"
                                    th:text="${f.name}"></span>
                            </td>

                            <td th:text="${f.contactno}"></td>

                            <td>
                                <span class="badge bg-primary"
                                    th:text="${f.subject}">
                                </span>
                            </td>

                            <td th:text="${f.responsetext}"></td>

                            <td>
                                <span class="text-success fw-semibold"
                                    th:text="${f.postdate}">
                                </span>
                            </td>
                            
                            <td>
                        <a th:href="@{/admin/deletefeed(id=${f.id})}" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                            

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
	</main>
</body>
</html>
