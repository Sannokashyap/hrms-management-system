<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
	<main>
		<h1>View Enquiry</h1>
		<hr />
		
		<div  th:if="${msg}">
		<p th:text="${msg}" style="color:red;text-align:center;"></p>
		</div>
<!-- ================= HERO ================= -->
<div class="card border-0 shadow-sm  mt-4">

    <!-- Header -->
    <div class="card-header bg-white border-0 py-4">

        <div class="row align-items-center">

            <div class="col-md-6">

                <h4 class="fw-bold mb-1">
                    <i class="bi bi-envelope-paper-fill text-primary me-2"></i>
                    All Enquiries
                </h4>

                <small class="text-muted">
                    View and manage all enquiries
                </small>

            </div>

            <div class="col-md-6 text-md-end mt-3 mt-md-0">

                <div class="input-group ms-md-auto" style="max-width:300px;">

                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search"></i>
                    </span>

                    <input type="text"
                        class="form-control border-start-0"
                        placeholder="Search enquiry...">

                </div>

            </div>

        </div>

    </div>

    <!-- Table -->

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-dark">

                    <tr>

                        <th class="ps-4">Id</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Contact No</th>
                        <th>Email Address</th>
                        <th>Enquiry</th>
                        <th>Delete</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="enquiry : ${enquiry}">

                        <td class="ps-4 fw-semibold"
                            th:text="${enquiry.id}"></td>

                        <td th:text="${enquiry.name}"></td>

                        <td th:text="${enquiry.address}"></td>

                        <td th:text="${enquiry.contact_no}"></td>

                        <td th:text="${enquiry.emailaddress}"></td>

                        <td>

                            <span class="text-secondary"
                                th:text="${enquiry.enquirytext}">
                            </span>

                        </td>
                        <td>
                        <a th:href="@{/admin/deleteenq(id=${enquiry.id})}" class="btn btn-danger btn-sm">Delete</a>
                        </td>

                    </tr>

                    <!-- Empty Data -->

                    <tr th:if="${#lists.isEmpty(enquiry)}">

                        <td colspan="6" class="text-center py-5">

                            <i class="bi bi-inbox display-5 text-secondary"></i>

                            <h5 class="mt-3 text-secondary">
                                No Enquiries Found
                            </h5>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- Footer -->

    <div class="card-footer bg-white border-0 py-3">

        <div class="d-flex justify-content-between align-items-center">

            <small class="text-muted">
                Total Enquiries :
                <span class="fw-bold" th:text="${#lists.size(enquiry)}"></span>
            </small>

            <button class="btn btn-outline-primary btn-sm rounded-3">
                <i class="bi bi-arrow-clockwise"></i>
                Refresh
            </button>

        </div>

    </div>

</div>
	</main>
</body>
