<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
	<main>
		<h1>View Job seeker</h1>
		<hr />

<div  th:if="${msg}">
		<p th:text="${msg}" style="color:red;text-align:center;"></p>
		</div>
		<div class="card border-0 shadow-sm  mt-4">

    <!-- Header -->
    <div class="card-header bg-white border-0 py-4">

        <div class="row align-items-center">

            <div class="col-md-6">

                <h4 class="fw-bold mb-1">
                    <i class="bi bi-people-fill text-primary me-2"></i>
                    Job Seekers
                </h4>

                <small class="text-muted">
                    View all registered job seekers
                </small>

            </div>

            <div class="col-md-6 text-md-end mt-3 mt-md-0">

                <div class="input-group ms-md-auto" style="max-width:320px;">

                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search"></i>
                    </span>

                    <input type="text"
                           class="form-control border-start-0"
                           placeholder="Search candidate...">

                </div>

            </div>

        </div>

    </div>

    <!-- Table -->

    <div class="table-responsive">

        <table class="table table-hover align-middle mb-0">

            <thead class="table-dark">

                <tr>
					<th>Id</th>
                    <th class="ps-4">Name</th>
                    <th>Gender</th>
                    <th>Contact No</th>
                    <th>Email Address</th>
                    <th>Qualification</th>
                    <th>Experience</th>
                    <th>Key Skills</th>
                    <th>Address</th>
                    <th>Delete</th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="user : ${users}">

					<td  th:text="${user.userid}">
					
					</td>
                    <td class="ps-4 fw-semibold"
                        th:text="${user.name}"></td>

                    <td>

                        <span class="badge bg-info"
                              th:text="${user.gender}">
                        </span>

                    </td>

                    <td th:text="${user.contactno}"></td>

                    <td th:text="${user.emailaddress}"></td>

                    <td>

                        <span class="badge bg-success"
                              th:text="${user.qualification}">
                        </span>

                    </td>

                    <td th:text="${user.experience}"></td>

                    <td th:text="${user.keyskill}"></td>

                    <td th:text="${user.address}"></td>

				<td>
                        <a th:href="@{/admin/deletejob(id=${user.userid})}" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                </tr>

                <!-- Empty Record -->

                <tr th:if="${#lists.isEmpty(users)}">

                    <td colspan="8" class="text-center py-5">

                        <i class="bi bi-people display-5 text-secondary"></i>

                        <h5 class="mt-3 text-secondary">
                            No Job Seekers Found
                        </h5>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- Footer -->

    <div class="card-footer bg-white border-0 py-3">

        <div class="d-flex justify-content-between align-items-center">

            <small class="text-muted">

                Total Candidates :
                <span class="fw-bold"
                      th:text="${#lists.size(users)}"></span>

            </small>

            <button class="btn btn-outline-primary btn-sm rounded-3">

                <i class="bi bi-arrow-clockwise"></i>

                Refresh

            </button>

        </div>

    </div>

</div>
	</main>
</body>
