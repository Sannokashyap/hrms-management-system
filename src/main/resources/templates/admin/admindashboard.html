<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
 <main>
 	
 	
 <!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div class="container-fluid py-4">

    <!-- Dashboard Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="rounded-3 shadow-sm p-4 text-white"
                style="background: linear-gradient(135deg, #2563EB 0%, #4F46E5 45%, #7C3AED 75%, #6D28D9 100%);">

                <h2 class="fw-bold mb-1 text-white">
                    <i class="fa-solid fa-gauge-high me-2"></i>
                    Admin Dashboard
                </h2>

                <p class="mb-0 text-white">
                    Welcome to HRMS Administration Panel
                </p>

            </div>
        </div>
    </div>

    <!-- Dashboard Cards -->
    <div class="row g-4">

        <!-- Total Users -->
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 text-white"
                style="background: linear-gradient(135deg, #1E3A8A, #2563EB);">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-uppercase mb-2 text-white">Total Users</h6>
                        <h2 class="fw-bold mb-0 text-white" th:text="${usercounter}">0</h2>
                    </div>
                    <i class="fa-solid fa-users fa-3x opacity-75"></i>
                </div>
            </div>
        </div>

        <!-- Job Seekers -->
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 text-white"
                style="background: linear-gradient(135deg, #065F46, #10B981);">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-uppercase mb-2 text-white">Job Seekers</h6>
                        <h2 class="fw-bold mb-0 text-white" th:text="${jobseekercounter}">0</h2>
                    </div>
                    <i class="fa-solid fa-user-tie fa-3x opacity-75"></i>
                </div>
            </div>
        </div>

        <!-- Posted Jobs -->
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 text-white"
                style="background: linear-gradient(135deg, #0F766E, #14B8A6);">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-uppercase mb-2 text-white">Posted Jobs</h6>
                        <h2 class="fw-bold mb-0 text-white" th:text="${jobcounter}">0</h2>
                    </div>
                    <i class="fa-solid fa-briefcase fa-3x opacity-75"></i>
                </div>
            </div>
        </div>

        <!-- Enquiries -->
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 text-white"
                style="background: linear-gradient(135deg, #B45309, #F59E0B);">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-uppercase mb-2 text-white">Enquiries</h6>
                        <h2 class="fw-bold mb-0 text-white" th:text="${enquirycounter}">0</h2>
                    </div>
                    <i class="fa-solid fa-circle-question fa-3x opacity-75"></i>
                </div>
            </div>
        </div>

        <!-- Feedbacks -->
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 text-white"
                style="background: linear-gradient(135deg, #5B21B6, #8B5CF6);">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-uppercase mb-2 text-white">Feedbacks</h6>
                        <h2 class="fw-bold mb-0 text-white" th:text="${feedbackcounter}">0</h2>
                    </div>
                    <i class="fa-solid fa-comments fa-3x opacity-75"></i>
                </div>
            </div>
        </div>

        <!-- Complaints -->
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 text-white"
                style="background: linear-gradient(135deg, #B91C1C, #EF4444);">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-uppercase mb-2 text-white">Complaints</h6>
                        <h2 class="fw-bold mb-0 text-white" th:text="${complaintcounter}">0</h2>
                    </div>
                    <i class="fa-solid fa-triangle-exclamation fa-3x opacity-75"></i>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
 </main>
</body>
</html>
